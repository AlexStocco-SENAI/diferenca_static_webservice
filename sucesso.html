<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Interno - Sucesso</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .dashboard {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            border-top: 8px solid #28a745;
        }
        .icon {
            font-size: 50px;
            color: #28a745;
            margin-bottom: 20px;
        }
        h1 { color: #333; margin-bottom: 10px; }
        p { color: #666; line-height: 1.6; }
        .status-badge {
            display: inline-block;
            background-color: #d4edda;
            color: #155724;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .btn-logout {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            color: #dc3545;
            font-weight: bold;
            border: 2px solid #dc3545;
            padding: 8px 20px;
            border-radius: 6px;
            transition: 0.3s;
        }
        .btn-logout:hover {
            background-color: #dc3545;
            color: white;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="icon">🔓</div>
        <div class="status-badge">ACESSO PERMITIDO</div>
        <h1>Bem-vindo!</h1>
        <p>Você acessou a área restrita do sistema.</p>
        
    </div>

</body>
</html>
